name: Miuros
description: >-
  Miuros is a performance platform for customer service that provides AI-powered
  analytics, quality assurance (Review & Insights), and agent-assist automation
  (Assist) for international and scaling customer support teams. Founded as a
  standalone startup and backed by Techstars, Miuros was acquired by Dixa and is
  now offered as Miuros by Dixa. The Miuros product surface — Data sync, Review &
  Insights, Assist, and Miuros APIs — remains operational and is tracked on a
  dedicated Miuros status page, while platform developer documentation is served
  through the Dixa developer hub.
